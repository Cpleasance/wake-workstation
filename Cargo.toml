[package]
name = "wake-workstation"
version = "0.1.0"
edition = "2021"
authors = ["Cory Pleasance"]
license = "MIT"
description = "Wake-on-LAN + SSH + Moonlight streaming orchestrator for remote workstations & gaming PCs"
repository = "https://github.com/Cpleasance/wake-workstation"
homepage = "https://github.com/Cpleasance/wake-workstation"
readme = "README.md"

[[bin]]
name = "wake-workstation"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = "0.29"
chrono = "0.4"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

