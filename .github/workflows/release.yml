name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: wake-workstation.exe
            archive_ext: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: wake-workstation
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            bin_name: wake-workstation
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: wake-workstation
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release asset
        shell: bash
        run: |
          # Use tag name or fallback to short SHA / manual trigger ref
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_SHA::7}"
          fi

          PKG_NAME="wake-workstation-${TAG}-${{ matrix.target }}"
          STAGING_DIR="${PKG_NAME}"
          mkdir -p "${STAGING_DIR}"

          # Copy executable
          BIN_SRC="target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          if [ ! -f "${BIN_SRC}" ]; then
            BIN_SRC="target/release/${{ matrix.bin_name }}"
          fi
          cp "${BIN_SRC}" "${STAGING_DIR}/"

          # Copy documentation and license files
          if [ -f "README.md" ]; then cp "README.md" "${STAGING_DIR}/"; fi
          if [ -f "LICENSE" ]; then cp "LICENSE" "${STAGING_DIR}/"; fi
          if [ -f "LICENSE-MIT" ]; then cp "LICENSE-MIT" "${STAGING_DIR}/"; fi
          if [ -f "LICENSE-APACHE" ]; then cp "LICENSE-APACHE" "${STAGING_DIR}/"; fi

          # Create archive
          ARCHIVE_FILE="${PKG_NAME}.${{ matrix.archive_ext }}"
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            7z a "${ARCHIVE_FILE}" "${STAGING_DIR}"
          else
            tar -czvf "${ARCHIVE_FILE}" "${STAGING_DIR}"
          fi

          # Compute SHA-256 checksum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"
          else
            shasum -a 256 "${ARCHIVE_FILE}" > "${ARCHIVE_FILE}.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            wake-workstation-*.zip
            wake-workstation-*.tar.gz
            wake-workstation-*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-dist
          pattern: release-*
          merge-multiple: true

      - name: Generate consolidated checksums
        run: |
          cd release-dist
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt 2>/dev/null || true
          echo "Release contents:"
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
